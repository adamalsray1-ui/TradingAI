      - name: Find and build Android project
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -1)
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TradingAI-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
