name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o TradingAI_Android_v1.zip -d project
          find project -maxdepth 4 -type f

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle -type f | head -1)")
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TradingAI-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
